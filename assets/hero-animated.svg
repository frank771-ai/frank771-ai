<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Franklin Castillo Umaña — Creative Technology</title>
  <desc id="desc">Banner holográfico animado con auroras multicolor, órbitas, partículas y una cuadrícula tridimensional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"><animate attributeName="stop-color" values="#030712;#07132a;#030712" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset=".48" stop-color="#090b22"><animate attributeName="stop-color" values="#090b22;#160a2d;#090b22" dur="13s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#150622"><animate attributeName="stop-color" values="#150622;#06251f;#150622" dur="15s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#22c55e;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".25" stop-color="#2563eb"><animate attributeName="stop-color" values="#2563eb;#00e5ff;#2563eb" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#f472b6;#8b5cf6" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".75" stop-color="#ff3cac"><animate attributeName="stop-color" values="#ff3cac;#fb923c;#ff3cac" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#facc15"><animate attributeName="stop-color" values="#facc15;#8b5cf6;#facc15" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="cyanAura"><stop stop-color="#00e5ff" stop-opacity=".55"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pinkAura"><stop stop-color="#ff3cac" stop-opacity=".45"/><stop offset="1" stop-color="#ff3cac" stop-opacity="0"/></radialGradient>
    <radialGradient id="goldAura"><stop stop-color="#facc15" stop-opacity=".3"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <pattern id="microGrid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#60a5fa" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="16" y="16" width="1568" height="528" rx="36"/></clipPath>
    <path id="orbit" d="M360 282C500 96 1100 96 1240 282C1100 468 500 468 360 282Z"/>
  </defs>
  <style>
    .mono{font-family:Consolas,Cascadia Code,monospace;letter-spacing:1.8px}.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.dash{stroke-dasharray:7 15;animation:dash 12s linear infinite}.pulse{animation:pulse 12s ease-in-out infinite}.float{animation:float 12s ease-in-out infinite}.float2{animation:float2 12s ease-in-out infinite}.blink{animation:blink 1.5s ease-in-out infinite}.phrase{opacity:0;animation:phrase 12s ease-in-out infinite}.p1{animation-delay:0s}.p2{animation-delay:-4s}.p3{animation-delay:-8s}
    @keyframes dash{to{stroke-dashoffset:-176}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes float2{0%,100%{transform:translateY(-7px)}50%{transform:translateY(9px)}}@keyframes blink{50%{opacity:.15}}@keyframes phrase{0%,28%{opacity:1;transform:translateY(0)}33%,95%{opacity:0;transform:translateY(5px)}96%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1600" height="560" rx="38" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect x="16" y="16" width="1568" height="528" fill="url(#microGrid)"/>
    <circle cx="180" cy="100" r="300" fill="url(#cyanAura)" filter="url(#soft)"><animate attributeName="cx" values="180;390;180" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="1410" cy="420" r="320" fill="url(#pinkAura)" filter="url(#soft)"><animate attributeName="cy" values="420;200;420" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="590" r="260" fill="url(#goldAura)" filter="url(#soft)"><animate attributeName="cx" values="820;1030;820" dur="17s" repeatCount="indefinite"/></circle>
    <g opacity=".35" fill="none">
      <path d="M0 470 800 266 1600 470" stroke="#334d79"/><path d="M120 505 800 330 1480 505" stroke="#334d79"/><path d="M270 540 800 405 1330 540" stroke="#334d79"/>
      <path d="M260 350 800 560" stroke="#334d79"/><path d="M430 305 800 560" stroke="#334d79"/><path d="M600 276 800 560" stroke="#334d79"/><path d="M1340 350 800 560" stroke="#334d79"/><path d="M1170 305 800 560" stroke="#334d79"/><path d="M1000 276 800 560" stroke="#334d79"/>
    </g>
    <path d="M-80 402C210 270 420 490 700 350S1170 160 1680 322" fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-opacity=".42" class="dash"/>
    <path d="M-70 132C250 295 460 30 800 170S1270 390 1680 104" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".3" class="dash"/>
    <ellipse cx="800" cy="280" rx="460" ry="194" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".28" stroke-dasharray="3 14"/>
    <ellipse cx="800" cy="280" rx="350" ry="145" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity=".24" stroke-dasharray="11 12"><animate attributeName="stroke-dashoffset" values="0;-180" dur="12s" repeatCount="indefinite"/></ellipse>
    <g class="float"><g transform="translate(115 120)"><polygon points="0,35 35,0 70,35 35,70" fill="#071725" stroke="#00e5ff" stroke-width="2"/><polygon points="14,35 35,14 56,35 35,56" fill="none" stroke="#00e5ff" opacity=".5"/><circle cx="35" cy="35" r="5" fill="#00e5ff" filter="url(#smallGlow)" class="pulse"/></g></g>
    <g class="float2"><g transform="translate(1415 100)"><polygon points="0,42 42,0 84,42 42,84" fill="#1b0922" stroke="#ff3cac" stroke-width="2"/><path d="M20 42H64M42 20V64" stroke="#ff3cac" opacity=".65"/><circle cx="42" cy="42" r="5" fill="#ff3cac" filter="url(#smallGlow)" class="pulse"/></g></g>
    <g class="mono" font-size="13" font-weight="700">
      <g transform="translate(56 54)"><circle r="5" fill="#22c55e" filter="url(#smallGlow)" class="blink"/><text x="15" y="5" fill="#9fffc3">SYSTEM ONLINE</text></g>
      <text x="800" y="58" text-anchor="middle" fill="#8ba7c7">CREATIVE TECHNOLOGY // 2026</text><text x="1540" y="58" text-anchor="end" fill="#f9a8d4">CR · 10.4°N</text>
      <text x="62" y="510" fill="#67e8f9">FULL-STACK / CLOUD / AI / DATA</text><text x="1538" y="510" text-anchor="end" fill="#fde68a">BUILD → SHIP → EVOLVE</text>
    </g>
    <g class="ui" text-anchor="middle">
      <text x="800" y="225" font-size="70" font-weight="900" letter-spacing="4" fill="url(#spectrum)" filter="url(#glow)">FRANKLIN CASTILLO UMAÑA</text>
      <text x="800" y="292" font-size="28" font-weight="700" letter-spacing="7"><tspan fill="#22d3ee">FULL-STACK</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#60a5fa">CLOUD</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#c084fc">AI</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#f472b6">DATA</tspan></text>
      <g fill="#b8c7db" font-size="20" letter-spacing="3"><text x="800" y="340" class="phrase p1">IT ENGINEERING · COSTA RICA</text><text x="800" y="340" class="phrase p2">TURNING IDEAS INTO REAL SYSTEMS</text><text x="800" y="340" class="phrase p3">PRODUCTS · CLOUD · AUTOMATION</text></g>
      <g transform="translate(800 398)"><rect x="-244" y="-25" width="488" height="50" rx="25" fill="#080d1b" fill-opacity=".82" stroke="url(#spectrum)" stroke-opacity=".72"/><circle cx="-208" cy="0" r="7" fill="#22c55e" filter="url(#smallGlow)" class="blink"/><text x="18" y="7" fill="#e5f7ff" font-size="17" font-weight="700" letter-spacing="2">AVAILABLE TO BUILD WHAT'S NEXT</text></g>
    </g>
    <g filter="url(#smallGlow)"><circle r="5" fill="#00e5ff"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle><circle r="4" fill="#ff3cac"><animateMotion dur="5.5s" begin="-2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle><circle r="4" fill="#facc15"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
    <g fill="#fff"><circle cx="245" cy="325" r="2" class="pulse"/><circle cx="365" cy="90" r="3" fill="#00e5ff" class="pulse"/><circle cx="1235" cy="112" r="2" fill="#facc15" class="pulse"/><circle cx="1325" cy="380" r="3" fill="#ff3cac" class="pulse"/><circle cx="1075" cy="460" r="2" fill="#a78bfa" class="pulse"/></g>
    <rect x="-300" y="16" width="170" height="528" fill="url(#beam)" opacity=".4" transform="skewX(-18)"><animate attributeName="x" values="-300;2000" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="16" y="16" width="1568" height="528" rx="36" fill="none" stroke="url(#spectrum)" stroke-opacity=".6" stroke-width="2"/>
</svg>
