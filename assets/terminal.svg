<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Terminal holográfica de Franklin</title>
  <desc id="desc">Terminal animada con comandos, telemetría tecnológica y módulos de Full Stack, Cloud, IA y Datos.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b18"/><stop offset=".5" stop-color="#0c1024"/><stop offset="1" stop-color="#17091f"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".3" stop-color="#3b82f6"/><stop offset=".56" stop-color="#8b5cf6"/><stop offset=".8" stop-color="#ff3cac"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".2"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:Consolas,Cascadia Code,monospace}.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.line{opacity:1;animation:show 13s infinite}.l1{animation-delay:.3s}.l2{animation-delay:1.5s}.l3{animation-delay:2.8s}.l4{animation-delay:4.1s}.l5{animation-delay:5.4s}.l6{animation-delay:6.7s}.cursor{animation:blink .8s steps(2,end) infinite}.pulse{animation:pulse 2s ease-in-out infinite}.dash{stroke-dasharray:4 7;animation:dash 1.5s linear infinite}
      @keyframes show{0%,4%{opacity:0;transform:translateY(5px)}9%,84%{opacity:1;transform:translateY(0)}94%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.22}}@keyframes dash{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.line{opacity:1!important}}
    </style>
  </defs>
  <rect x="5" y="5" width="1190" height="380" rx="26" fill="url(#shell)" stroke="url(#rainbow)" stroke-width="2"/>
  <rect x="7" y="58" width="1186" height="320" fill="url(#grid)"/>
  <rect x="6" y="6" width="1188" height="52" rx="25" fill="#11182a"/><rect x="6" y="38" width="1188" height="20" fill="#11182a"/>
  <circle cx="35" cy="31" r="7" fill="#ff5f57"/><circle cx="59" cy="31" r="7" fill="#febc2e"/><circle cx="83" cy="31" r="7" fill="#28c840"/>
  <g class="ui" font-size="12" font-weight="700"><text x="124" y="35" fill="#22d3ee">PROFILE</text><text x="200" y="35" fill="#64748b">STACK</text><text x="258" y="35" fill="#64748b">TELEMETRY</text></g>
  <text x="1160" y="35" text-anchor="end" fill="#86efac" font-size="12" class="mono">● LIVE / franklin@portfolio</text>
  <rect x="6" y="56" width="1188" height="3" fill="url(#rainbow)"/>
  <g class="mono" font-size="17">
    <g class="line l1"><text x="34" y="94" fill="#c084fc">➜</text><text x="60" y="94" fill="#22d3ee">~</text><text x="82" y="94" fill="#e5f4ff">whoami --creative</text></g>
    <g class="line l2"><text x="34" y="126" fill="#94a3b8">Franklin Castillo</text><text x="190" y="126" fill="#64748b">//</text><text x="220" y="126" fill="#f472b6">IT Engineering @ UTN 🇨🇷</text></g>
    <g class="line l3"><text x="34" y="168" fill="#c084fc">➜</text><text x="60" y="168" fill="#22d3ee">~</text><text x="82" y="168" fill="#e5f4ff">./vision --mode=build</text></g>
    <g class="line l4"><text x="34" y="200" fill="#64748b">{</text><text x="52" y="200" fill="#67e8f9">"ideas"</text><text x="116" y="200" fill="#94a3b8">:</text><text x="132" y="200" fill="#fde68a">"systems"</text><text x="215" y="200" fill="#94a3b8">,</text><text x="234" y="200" fill="#f9a8d4">"impact"</text><text x="309" y="200" fill="#94a3b8">:</text><text x="325" y="200" fill="#86efac">true</text><text x="365" y="200" fill="#64748b">}</text></g>
    <g class="line l5"><text x="34" y="242" fill="#c084fc">➜</text><text x="60" y="242" fill="#22d3ee">~</text><text x="82" y="242" fill="#e5f4ff">git commit -m</text><text x="220" y="242" fill="#facc15">"make it real"</text></g>
    <g class="line l6"><text x="34" y="276" fill="#4ade80">✓ deployed</text><text x="137" y="276" fill="#64748b">// secure · observable · scalable</text><rect class="cursor" x="443" y="259" width="10" height="21" fill="#00e5ff" filter="url(#glow)"/></g>
  </g>
  <g transform="translate(760 80)">
    <rect width="400" height="226" rx="18" fill="#070b17" fill-opacity=".86" stroke="#34425f"/>
    <text x="22" y="29" fill="#a8bdd5" class="mono" font-size="12">RUNTIME MODULES</text><circle cx="370" cy="24" r="5" fill="#22c55e" filter="url(#glow)" class="pulse"/>
    <g class="ui" font-size="13" font-weight="700">
      <text x="22" y="67" fill="#22d3ee">FULL-STACK</text><rect x="130" y="56" width="235" height="12" rx="6" fill="#172036"/><rect x="130" y="56" height="12" rx="6" fill="#22d3ee"><animate attributeName="width" values="0;214;214" keyTimes="0;.35;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="22" y="105" fill="#60a5fa">CLOUD</text><rect x="130" y="94" width="235" height="12" rx="6" fill="#172036"/><rect x="130" y="94" height="12" rx="6" fill="#3b82f6"><animate attributeName="width" values="0;196;196" keyTimes="0;.43;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="22" y="143" fill="#c084fc">AI</text><rect x="130" y="132" width="235" height="12" rx="6" fill="#172036"/><rect x="130" y="132" height="12" rx="6" fill="#a855f7"><animate attributeName="width" values="0;184;184" keyTimes="0;.51;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="22" y="181" fill="#f472b6">DATA</text><rect x="130" y="170" width="235" height="12" rx="6" fill="#172036"/><rect x="130" y="170" height="12" rx="6" fill="#ec4899"><animate attributeName="width" values="0;204;204" keyTimes="0;.6;1" dur="4s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M22 205H365" stroke="url(#rainbow)" stroke-width="2" class="dash"/><text x="22" y="220" fill="#86efac" class="mono" font-size="11">ALL SYSTEMS READY</text>
  </g>
  <g transform="translate(34 335)" class="mono" font-size="11"><circle cy="0" r="4" fill="#22c55e" class="pulse"/><text x="13" y="4" fill="#86efac">UPTIME 99.9%</text><text x="160" y="4" fill="#67e8f9">LATENCY 24ms</text><text x="300" y="4" fill="#c4b5fd">CURIOSITY ∞</text><text x="1125" y="4" text-anchor="end" fill="#f9a8d4">BUILD #2026.10</text></g>
  <rect x="-210" y="60" width="180" height="310" fill="url(#scan)" transform="skewX(-14)"><animate attributeName="x" values="-210;1450" dur="6s" repeatCount="indefinite"/></rect>
</svg>
