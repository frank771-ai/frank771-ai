<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Terminal animada de Franklin</title>
  <desc id="desc">Una terminal presenta el perfil, el enfoque y las tecnologías de Franklin</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A111C"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00E5FF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .line{opacity:1;animation:show 12s infinite}.l1{animation-delay:.4s}.l2{animation-delay:1.7s}.l3{animation-delay:3.1s}.l4{animation-delay:4.6s}.l5{animation-delay:6.1s}.l6{animation-delay:7.6s}
      .cursor{animation:blink .8s steps(2,end) infinite}.scan{animation:scan 5s linear infinite}
      @keyframes show{0%,5%{opacity:0;transform:translateY(5px)}9%,82%{opacity:1;transform:translateY(0)}92%,100%{opacity:0}}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
      @media (prefers-reduced-motion:reduce){.line,.cursor,.scan{animation:none!important;opacity:1!important}}
    </style>
  </defs>
  <rect x="6" y="6" width="1188" height="318" rx="24" fill="url(#shell)" stroke="#26364B" stroke-width="2"/>
  <rect x="6" y="6" width="1188" height="52" rx="24" fill="#151F2E"/>
  <rect x="6" y="42" width="1188" height="16" fill="#151F2E"/>
  <circle cx="36" cy="31" r="7" fill="#FF5F57"/><circle cx="61" cy="31" r="7" fill="#FEBC2E"/><circle cx="86" cy="31" r="7" fill="#28C840"/>
  <text x="600" y="37" text-anchor="middle" fill="#91A4BA" font-size="16" font-family="Segoe UI,Arial,sans-serif">franklin@portfolio — zsh</text>
  <rect x="6" y="56" width="1188" height="3" fill="url(#bar)" opacity=".65"/>
  <g font-family="Consolas,Cascadia Code,monospace" font-size="19">
    <g class="line l1"><text x="38" y="94" fill="#8B5CF6">➜</text><text x="68" y="94" fill="#00E5FF">~</text><text x="92" y="94" fill="#E6EDF3">whoami</text></g>
    <g class="line l2"><text x="38" y="128" fill="#A9B7C6">Franklin Castillo — IT Engineering @ UTN 🇨🇷</text></g>
    <g class="line l3"><text x="38" y="170" fill="#8B5CF6">➜</text><text x="68" y="170" fill="#00E5FF">~</text><text x="92" y="170" fill="#E6EDF3">cat focus.json</text></g>
    <g class="line l4"><text x="38" y="204" fill="#A9B7C6">{ "build": "full-stack", "scale": "cloud", "think": "data + AI" }</text></g>
    <g class="line l5"><text x="38" y="246" fill="#8B5CF6">➜</text><text x="68" y="246" fill="#00E5FF">~</text><text x="92" y="246" fill="#E6EDF3">git commit -m "turn ideas into working systems"</text></g>
    <g class="line l6"><text x="38" y="282" fill="#3DFF9A">✓ shipped with curiosity, security and coffee</text><rect class="cursor" x="540" y="265" width="11" height="22" fill="#00E5FF" filter="url(#glow)"/></g>
  </g>
  <rect class="scan" x="-220" y="60" width="170" height="258" fill="#00E5FF" opacity=".025" transform="skewX(-16)"/>
</svg>
