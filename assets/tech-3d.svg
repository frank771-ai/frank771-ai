<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Laboratorio tecnológico tridimensional de Franklin</title>
  <desc id="desc">Escena isométrica animada con un núcleo central, plataformas de Full Stack, Cloud, Inteligencia Artificial y Datos, partículas y haces de luz.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0b1027"/>
      <stop offset="1" stop-color="#10051f"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="52%" r="56%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".23"/>
      <stop offset=".48" stop-color="#8b5cf6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16f2ff"/>
      <stop offset="1" stop-color="#0574a5"/>
    </linearGradient>
    <linearGradient id="violetFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="pinkFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="greenFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18223f"/>
      <stop offset="1" stop-color="#090d20"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#00e5ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1398" height="648" rx="28"/></clipPath>
    <path id="orbitA" d="M420 350 C500 200 900 200 980 350 C900 500 500 500 420 350Z"/>
    <path id="orbitB" d="M515 350 C575 250 825 250 885 350 C825 450 575 450 515 350Z"/>
  </defs>

  <style>
    .grid-line { stroke:#233356; stroke-width:1; opacity:.52 }
    .connector { fill:none; stroke:#00e5ff; stroke-width:2; stroke-dasharray:8 11; opacity:.55; animation: dash 2.2s linear infinite }
    .orbit { fill:none; stroke-width:2; stroke-dasharray:4 12; animation: dash 4s linear infinite }
    .float-a { animation: floatA 4.8s ease-in-out infinite }
    .float-b { animation: floatB 5.7s ease-in-out infinite }
    .pulse { animation: pulse 2.6s ease-in-out infinite }
    .blink { animation: blink 1.8s ease-in-out infinite }
    .scan { animation: scan 5s ease-in-out infinite }
    .label { font-family:Inter,Segoe UI,Arial,sans-serif; font-weight:800; letter-spacing:2px; fill:#e6f7ff }
    .micro { font-family:Consolas,Courier New,monospace; fill:#7dd3fc; letter-spacing:1.5px }
    @keyframes dash { to { stroke-dashoffset:-38 } }
    @keyframes floatA { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-12px) } }
    @keyframes floatB { 0%,100% { transform:translateY(-6px) } 50% { transform:translateY(8px) } }
    @keyframes pulse { 0%,100% { opacity:.42 } 50% { opacity:1 } }
    @keyframes blink { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    @keyframes scan { 0%,12% { transform:translateY(-260px); opacity:0 } 30%,68% { opacity:.72 } 88%,100% { transform:translateY(250px); opacity:0 } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1400" height="650" fill="url(#bg)"/>
    <rect width="1400" height="650" fill="url(#aura)"/>
    <circle cx="1210" cy="90" r="220" fill="#8b5cf6" opacity=".055"/>
    <circle cx="160" cy="555" r="230" fill="#00e5ff" opacity=".045"/>

    <g opacity=".5">
      <path d="M110 500 700 195 1290 500 700 620Z" fill="#070b19" stroke="#26385f" stroke-width="2"/>
      <path class="grid-line" d="M205 512 700 255 1195 512"/><path class="grid-line" d="M315 534 700 335 1085 534"/><path class="grid-line" d="M425 556 700 414 975 556"/><path class="grid-line" d="M535 578 700 493 865 578"/>
      <path class="grid-line" d="M210 448 700 620"/><path class="grid-line" d="M330 386 700 620"/><path class="grid-line" d="M450 324 700 620"/><path class="grid-line" d="M570 262 700 620"/>
      <path class="grid-line" d="M1190 448 700 620"/><path class="grid-line" d="M1070 386 700 620"/><path class="grid-line" d="M950 324 700 620"/><path class="grid-line" d="M830 262 700 620"/>
    </g>

    <text x="62" y="63" class="label" font-size="24">IMMERSIVE TECH LAB</text>
    <text x="64" y="91" class="micro" font-size="13">SYSTEM // ONLINE · DEPTH // ACTIVE · MOTION // SYNCED</text>
    <g transform="translate(1196 52)">
      <circle cx="0" cy="0" r="6" fill="#22d3ee" filter="url(#softGlow)" class="blink"/>
      <text x="18" y="5" class="micro" font-size="13">LIVE SCENE</text>
    </g>

    <ellipse cx="700" cy="375" rx="340" ry="146" class="orbit" stroke="#8b5cf6" opacity=".36"/>
    <ellipse cx="700" cy="375" rx="248" ry="103" class="orbit" stroke="#00e5ff" opacity=".5"/>
    <path class="connector" d="M700 350 353 305"/><path class="connector" d="M700 350 1047 305"/>
    <path class="connector" d="M700 350 410 490"/><path class="connector" d="M700 350 990 490"/>

    <g class="float-a" filter="url(#shadow)">
      <g transform="translate(250 235)">
        <polygon points="0,50 105,0 210,50 105,102" fill="url(#platform)" stroke="#00e5ff" stroke-opacity=".66"/>
        <polygon points="0,50 105,102 105,130 0,78" fill="#071527" stroke="#00e5ff" stroke-opacity=".38"/>
        <polygon points="105,102 210,50 210,78 105,130" fill="#101036" stroke="#8b5cf6" stroke-opacity=".45"/>
        <text x="105" y="58" text-anchor="middle" class="label" font-size="17">FULL-STACK</text>
        <text x="105" y="82" text-anchor="middle" class="micro" font-size="11">WEB · API · UX</text>
        <circle cx="22" cy="52" r="4" fill="#00e5ff" filter="url(#softGlow)" class="pulse"/>
      </g>
    </g>

    <g class="float-b" filter="url(#shadow)">
      <g transform="translate(940 235)">
        <polygon points="0,50 105,0 210,50 105,102" fill="url(#platform)" stroke="#a78bfa" stroke-opacity=".72"/>
        <polygon points="0,50 105,102 105,130 0,78" fill="#11102d" stroke="#8b5cf6" stroke-opacity=".48"/>
        <polygon points="105,102 210,50 210,78 105,130" fill="#171039" stroke="#a78bfa" stroke-opacity=".48"/>
        <text x="105" y="58" text-anchor="middle" class="label" font-size="17">CLOUD</text>
        <text x="105" y="82" text-anchor="middle" class="micro" font-size="11">CI/CD · K8S · OPS</text>
        <circle cx="188" cy="52" r="4" fill="#a78bfa" filter="url(#softGlow)" class="pulse"/>
      </g>
    </g>

    <g class="float-b" filter="url(#shadow)">
      <g transform="translate(305 430)">
        <polygon points="0,42 90,0 180,42 90,86" fill="url(#platform)" stroke="#f472b6" stroke-opacity=".68"/>
        <polygon points="0,42 90,86 90,108 0,64" fill="#241020" stroke="#f472b6" stroke-opacity=".4"/>
        <polygon points="90,86 180,42 180,64 90,108" fill="#32102e" stroke="#f472b6" stroke-opacity=".4"/>
        <text x="90" y="49" text-anchor="middle" class="label" font-size="16">AI</text>
        <text x="90" y="70" text-anchor="middle" class="micro" font-size="10">LLM · AGENTS</text>
      </g>
    </g>

    <g class="float-a" filter="url(#shadow)">
      <g transform="translate(915 430)">
        <polygon points="0,42 90,0 180,42 90,86" fill="url(#platform)" stroke="#5eead4" stroke-opacity=".68"/>
        <polygon points="0,42 90,86 90,108 0,64" fill="#09201f" stroke="#5eead4" stroke-opacity=".4"/>
        <polygon points="90,86 180,42 180,64 90,108" fill="#0d2b2a" stroke="#5eead4" stroke-opacity=".4"/>
        <text x="90" y="49" text-anchor="middle" class="label" font-size="16">DATA</text>
        <text x="90" y="70" text-anchor="middle" class="micro" font-size="10">SQL · PIPELINES</text>
      </g>
    </g>

    <g class="float-a" filter="url(#shadow)">
      <ellipse cx="700" cy="492" rx="142" ry="51" fill="#000" opacity=".42"/>
      <polygon points="700,194 828,260 700,328 572,260" fill="url(#cyanFace)" stroke="#7df9ff" stroke-width="2"/>
      <polygon points="572,260 700,328 700,474 572,403" fill="url(#violetFace)" stroke="#a78bfa" stroke-width="2"/>
      <polygon points="700,328 828,260 828,403 700,474" fill="url(#pinkFace)" stroke="#f0abfc" stroke-width="2"/>
      <polygon points="700,225 770,261 700,298 630,261" fill="#081324" stroke="#b6fbff" stroke-width="2"/>
      <circle cx="700" cy="261" r="20" fill="#00e5ff" opacity=".9" filter="url(#glow)" class="pulse"/>
      <circle cx="700" cy="261" r="7" fill="#fff"/>
      <path d="M603 294 700 345 797 294" fill="none" stroke="#fff" stroke-opacity=".25"/>
      <path d="M700 345V445" stroke="#fff" stroke-opacity=".22"/>
      <text x="640" y="371" text-anchor="middle" class="label" font-size="15" transform="rotate(28 640 371)">BUILD</text>
      <text x="760" y="371" text-anchor="middle" class="label" font-size="15" transform="rotate(-28 760 371)">SHIP</text>
      <text x="700" y="501" text-anchor="middle" class="micro" font-size="13">CORE // SCALE</text>
    </g>

    <g class="scan" opacity=".6">
      <polygon points="435,230 700,92 965,230 700,368" fill="url(#scan)"/>
      <path d="M435 230 700 368 965 230" fill="none" stroke="#00e5ff" stroke-opacity=".65"/>
    </g>

    <g filter="url(#softGlow)">
      <circle r="5" fill="#00e5ff"><animateMotion dur="5.4s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
      <circle r="4" fill="#f472b6"><animateMotion dur="4.1s" begin="-2s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
      <circle r="4" fill="#a78bfa"><animateMotion dur="3.6s" begin="-1s" repeatCount="indefinite"><mpath href="#orbitB"/></animateMotion></circle>
      <circle r="3" fill="#5eead4"><animateMotion dur="4.8s" begin="-3s" repeatCount="indefinite"><mpath href="#orbitB"/></animateMotion></circle>
    </g>

    <g opacity=".58" class="blink">
      <circle cx="92" cy="165" r="2" fill="#00e5ff"/><circle cx="1284" cy="182" r="2" fill="#a78bfa"/>
      <circle cx="178" cy="344" r="2" fill="#f472b6"/><circle cx="1220" cy="420" r="2" fill="#5eead4"/>
      <circle cx="1130" cy="118" r="2" fill="#00e5ff"/><circle cx="310" cy="118" r="2" fill="#a78bfa"/>
    </g>
  </g>
  <rect x="1" y="1" width="1398" height="648" rx="28" fill="none" stroke="#26385f" stroke-width="2"/>
</svg>
