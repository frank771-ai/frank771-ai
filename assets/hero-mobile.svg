  <title id="title">Franklin Castillo Umaña — Creative Technology</title><desc id="desc">Portada móvil holográfica con auroras, geometría, partículas y mensajes animados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0b1027"/><stop offset="1" stop-color="#19091f"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".28" stop-color="#3b82f6"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset=".76" stop-color="#ff3cac"/><stop offset="1" stop-color="#facc15"/></linearGradient><radialGradient id="a1"><stop stop-color="#00e5ff" stop-opacity=".5"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient><radialGradient id="a2"><stop stop-color="#ff3cac" stop-opacity=".42"/><stop offset="1" stop-color="#ff3cac" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#60a5fa" stroke-opacity=".06"/></pattern><filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter><clipPath id="f"><rect x="12" y="12" width="696" height="856" rx="34"/></clipPath></defs>
  <style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Cascadia Code,monospace}.phrase{opacity:0;animation:phrase 12s ease-in-out infinite}.p1{animation-delay:0s}.p2{animation-delay:-4s}.p3{animation-delay:-8s}.dash{stroke-dasharray:6 13;animation:d 12s linear infinite}.pulse{animation:p 12s ease-in-out infinite}@keyframes phrase{0%,28%{opacity:1;transform:translateY(0)}33%,95%{opacity:0;transform:translateY(6px)}96%,100%{opacity:1}}@keyframes d{to{stroke-dashoffset:-160}}@keyframes p{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.p1{opacity:1!important}.p2,.p3{display:none}}</style>
