<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Franklin Castillo Umaña</title>
  <desc id="desc">Banner tecnológico animado en tonos cian y violeta</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B13">
        <animate attributeName="stop-color" values="#060B13;#0A1020;#060B13" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#160B2B">
        <animate attributeName="stop-color" values="#160B2B;#071F2B;#160B2B" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6BE8FF" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="1560" height="480" rx="34"/></clipPath>
  </defs>

  <rect width="1600" height="520" rx="38" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="1560" height="480" fill="url(#grid)"/>
    <circle cx="210" cy="130" r="220" fill="url(#halo)" filter="url(#soft)">
      <animate attributeName="cx" values="210;380;210" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="410" r="250" fill="#8B5CF6" opacity=".14" filter="url(#soft)">
      <animate attributeName="cy" values="410;250;410" dur="14s" repeatCount="indefinite"/>
    </circle>

    <g fill="none" stroke-linecap="round">
      <path d="M-80 390C220 270 330 470 650 340S1110 180 1700 310" stroke="#00E5FF" stroke-opacity=".18" stroke-width="2" stroke-dasharray="8 20">
        <animate attributeName="stroke-dashoffset" values="0;-280" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M-100 130C250 260 470 30 780 170S1260 380 1720 120" stroke="#8B5CF6" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 18">
        <animate attributeName="stroke-dashoffset" values="0;220" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>

    <g opacity=".9">
      <g transform="translate(145 110)">
        <circle r="56" fill="none" stroke="#00E5FF" stroke-opacity=".28" stroke-width="2" stroke-dasharray="9 8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
        </circle>
        <circle r="6" fill="#00E5FF" filter="url(#glow)"/>
      </g>
      <g transform="translate(1435 118)">
        <circle r="70" fill="none" stroke="#8B5CF6" stroke-opacity=".32" stroke-width="2" stroke-dasharray="5 12">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        </circle>
        <circle r="7" fill="#8B5CF6" filter="url(#glow)"/>
      </g>
    </g>

    <g fill="#BFF8FF">
      <circle cx="80" cy="320" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="430" r="4"><animate attributeName="opacity" values="1;.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="90" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="80" r="4"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1290" cy="430" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1530" cy="330" r="4"><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
      <text x="800" y="208" fill="#F5FBFF" font-size="68" font-weight="800" letter-spacing="3" filter="url(#glow)">FRANKLIN CASTILLO UMAÑA</text>
      <rect x="525" y="245" width="550" height="3" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="120;550;120" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x" values="740;525;740" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="800" y="306" fill="#00E5FF" font-size="29" font-weight="600" letter-spacing="5">FULL-STACK · CLOUD · AI · DATA</text>
      <text x="800" y="358" fill="#A9B7C6" font-size="22" letter-spacing="2">IT ENGINEERING · COSTA RICA</text>
      <g transform="translate(800 413)">
        <circle cx="-176" cy="-7" r="7" fill="#3DFF9A" filter="url(#glow)">
          <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="-158" y="0" fill="#D9FBE8" font-size="19" font-weight="600" text-anchor="start">AVAILABLE TO BUILD WHAT'S NEXT</text>
      </g>
    </g>

    <rect x="20" y="20" width="1560" height="480" rx="34" fill="none" stroke="url(#accent)" stroke-opacity=".45" stroke-width="2"/>
    <rect x="-260" y="20" width="180" height="480" fill="white" opacity=".035" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1900" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
