<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle glow filter -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="glowBlur" />
      <feMerge>
        <feMergeNode in="glowBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Fluent Design inspired gradients -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A" /> 
      <stop offset="100%" stop-color="#1A2330" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096FF" /> 
      <stop offset="100%" stop-color="#0047B3" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#8E44AD" />
    </linearGradient>
    
    <!-- Subtle radial gradient for nodes -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0096FF" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#backgroundGradient)" />

  <!-- Abstract circuit lines and network nodes -->
  <g id="background-elements" filter="url(#subtleGlow)" opacity="0.5">
    <!-- Thinner lines, subtle colors -->
    <path d="M150 180 Q 250 100 400 180 T 700 180" stroke="#00BFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M700 180 L 700 280 Q 600 380 500 280 T 300 280" stroke="#007BFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="180" r="12" fill="url(#nodeGradient)"/>
    <circle cx="400" cy="180" r="17" fill="url(#nodeGradient)"/>
    <circle cx="700" cy="180" r="12" fill="url(#nodeGradient)"/>
    <circle cx="500" cy="280" r="22" fill="url(#nodeGradient)"/>
    <circle cx="300" cy="280" r="12" fill="url(#nodeGradient)"/>
    <circle cx="900" cy="320" r="17" fill="url(#nodeGradient)"/>
    <path d="M900 320 Q 1050 220 1200 320 T 1500 320" stroke="#8A2BE2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="1200" cy="320" r="12" fill="url(#nodeGradient)"/>
    <circle cx="1500" cy="320" r="17" fill="url(#nodeGradient)"/>
  </g>

  <!-- Text content -->
  <g id="text-content" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" fill="#E0E0E0" filter="url(#subtleGlow)">
    <!-- Main title -->
    <text x="50%" y="150" font-size="52" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Franklin Castillo Umaña</text>
    
    <!-- Simplified specialties line -->
    <text x="50%" y="250" font-size="28" text-anchor="middle" dominant-baseline="middle" fill="#00BFFF">
      IT Student • Data Analytics • AI • Cloud Computing
    </text>
  </g>

  <!-- Accent shapes for glassmorphism effect - subtle and minimal -->
  <g id="accent-shapes" opacity="0.3">
    <rect x="1400" y="100" width="80" height="80" rx="10" transform="rotate(30 1400 100)" fill="#0096FF" filter="url(#subtleGlow)"/>
    <circle cx="1500" cy="300" r="50" fill="#7F00FF" filter="url(#subtleGlow)"/>
    <rect x="50" y="100" width="70" height="70" rx="8" transform="rotate(-20 50 100)" fill="#00BFFF" filter="url(#subtleGlow)"/>
  </g>
</svg>
