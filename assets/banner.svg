<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" style="background-color: #1e1e1e;">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6; stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bannerGradient)" />

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="40" fill="#ffffff" filter="url(#shadow)">
    Franklin Castillo Umaña
  </text>
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="22" fill="#a0a0a0">
    IT Engineering Student
  </text>
  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="18" fill="#cccccc">
    Universidad Técnica Nacional (UTN)
  </text>

  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" fill="#ffffff" opacity="0.8">
    Software • Cloud • AI • Data • Networks • Automation
  </text>
</svg>
