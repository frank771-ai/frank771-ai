<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="insetGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="15" result="glowBlur"/>
      <feComposite operator="in" in="glowBlur" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A00E0; stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0077B6; stop-opacity:0.4" />
    </radialGradient>
  </defs>

  <!-- Background elements -->
  <rect width="1600" height="500" fill="url(#primaryGradient)"/>

  <!-- Abstract circuit lines and network nodes -->
  <g id="background-elements" filter="url(#glow)" opacity="0.7">
    <path d="M100 150 Q 250 50 400 150 T 700 150" stroke="cyan" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M700 150 L 700 250 Q 600 350 500 250 T 300 250" stroke="electricblue" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="150" r="15" fill="url(#nodeGradient)"/>
    <circle cx="400" cy="150" r="20" fill="url(#nodeGradient)"/>
    <circle cx="700" cy="150" r="15" fill="url(#nodeGradient)"/>
    <circle cx="500" cy="250" r="25" fill="url(#nodeGradient)"/>
    <circle cx="300" cy="250" r="15" fill="url(#nodeGradient)"/>
    <circle cx="900" cy="300" r="20" fill="url(#nodeGradient)"/>
    <path d="M900 300 Q 1050 200 1200 300 T 1500 300" stroke="purple" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="1200" cy="300" r="15" fill="url(#nodeGradient)"/>
    <circle cx="1500" cy="300" r="20" fill="url(#nodeGradient)"/>
  </g>

  <!-- Dashboard style panels -->
  <g id="panels" opacity="0.8">
    <rect x="50" y="400" width="200" height="60" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(0,255,255,0.3)" stroke-width="2" filter="url(#insetGlow)"/>
    <rect x="300" y="400" width="200" height="60" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(0,119,182,0.3)" stroke-width="2" filter="url(#insetGlow)"/>
    <rect x="550" y="400" width="200" height="60" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(142,68,173,0.3)" stroke-width="2" filter="url(#insetGlow)"/>
  </g>

  <!-- Text content -->
  <g id="text-content" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" fill="white" filter="url(#glow)">
    <text x="800" y="100" font-size="48" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Franklin Castillo Umaña</text>
    
    <!-- List of roles/areas -->
    <g text-anchor="middle" dominant-baseline="middle" font-size="24" opacity="0.9">
      <text x="800" y="180">IT Student</text>
      <text x="800" y="220">Data Analytics</text>
      <text x="800" y="260">Artificial Intelligence</text>
      <text x="800" y="300">Cloud Computing</text>
      <text x="800" y="340">Automation</text>
      <text x="800" y="380">Web Development</text>
    </g>
  </g>

  <!-- Accent shapes for glassmorphism effect -->
  <g id="accent-shapes" opacity="0.6">
    <path d="M1400 100 Q 1500 150 1400 200 L 1300 150 Z" fill="rgba(0,255,255,0.3)" filter="url(#glow)"/>
    <circle cx="1500" cy="300" r="40" fill="rgba(142,68,173,0.3)" filter="url(#glow)"/>
    <rect x="50" y="100" width="80" height="80" rx="10" fill="rgba(0,119,182,0.3)" transform="rotate(45 50 100)" filter="url(#glow)"/>
  </g>
</svg>
