<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc">
  <title id="title">Productos destacados de Franklin Castillo</title><desc id="desc">Vista móvil de note, AURA, CloudScraperLLM y Café Salas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".5" stop-color="#0b1024"/><stop offset="1" stop-color="#16091e"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".35" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#ff3cac"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3cac"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#facc15"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#60a5fa" stroke-opacity=".04"/></pattern><filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Cascadia Code,monospace}.card{fill:#080d1b;stroke:#2a3b5d;stroke-width:2}.title{font:800 35px Inter,Segoe UI,Arial,sans-serif;fill:#f3f8ff}.tag{font:600 17px Inter,Segoe UI,Arial,sans-serif;fill:#9db0c7}.micro{font:13px Consolas,Cascadia Code,monospace;fill:#8da0b8}.label{font:800 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.3px}.float{animation:f 12s ease-in-out infinite}.pulse{animation:p 3s ease-in-out infinite}.dash{stroke-dasharray:5 10;animation:d 12s linear infinite}@keyframes f{50%{transform:translateY(-8px)}}@keyframes p{50%{opacity:.3}}@keyframes d{to{stroke-dashoffset:-90}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x="1" y="1" width="718" height="1658" rx="28" fill="url(#bg)" stroke="#293a60" stroke-width="2"/><rect x="1" y="1" width="718" height="1658" rx="28" fill="url(#grid)"/><text x="34" y="51" class="ui" font-size="20" font-weight="800" fill="#eff8ff" letter-spacing="1.5">SELECTED PRODUCTS // 01—04</text><path d="M34 73H686" stroke="url(#s)" stroke-width="3" class="dash"/>

  <g transform="translate(28 100)"><rect width="664" height="350" rx="24" class="card"/><rect width="8" height="350" rx="4" fill="url(#pink)"/><text x="28" y="38" class="label" fill="#f9a8d4">01 · FLAGSHIP / OWN BUSINESS</text><text x="28" y="84" class="title">note.</text><text x="28" y="114" class="tag">Perfumería curada para descubrir mejor.</text><text x="28" y="153" class="micro">SEARCH · FILTERS · COMPARE · FAVORITES</text><text x="28" y="177" class="micro">NEXT.JS · REACT · TYPESCRIPT · SUPABASE</text><g transform="translate(438 54)" class="float"><rect width="180" height="220" rx="20" fill="#160c1d" stroke="#612653"/><rect x="62" y="34" width="56" height="22" rx="6" fill="#351936"/><rect x="42" y="54" width="96" height="112" rx="24" fill="url(#pink)"/><path d="M61 91H119M61 110H105" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".65"/><circle cx="128" cy="151" r="8" fill="#facc15" filter="url(#g)" class="pulse"/><rect x="24" y="188" width="132" height="14" rx="7" fill="#2d172d"/></g><g transform="translate(28 288)"><rect width="92" height="29" rx="14" fill="#291126" stroke="#ff3cac"/><text x="46" y="20" text-anchor="middle" class="label" fill="#f9a8d4">PRIVATE</text><rect x="104" width="126" height="29" rx="14" fill="#15112c" stroke="#8b5cf6"/><text x="167" y="20" text-anchor="middle" class="label" fill="#c4b5fd">IN BUILD</text></g></g>

