  <g transform="translate(28 856)"><rect width="664" height="350" rx="24" class="card"/><rect width="8" height="350" rx="4" fill="url(#violet)"/><text x="28" y="38" class="label" fill="#c4b5fd">03 · AI PIPELINE / AUTOMATION</text><text x="28" y="84" class="title">CloudScraperLLM</text><text x="28" y="114" class="tag">De productos dispersos a inteligencia útil.</text><text x="28" y="153" class="micro">EXTRACT · STORE · SCHEDULE · SUMMARIZE</text><text x="28" y="177" class="micro">PYTHON · FLASK · AZURE OPENAI</text><g transform="translate(422 48)" class="float"><rect width="196" height="220" rx="20" fill="#100c20" stroke="#49327a"/><text x="18" y="27" class="micro">PIPELINE</text><path d="M32 68H164M32 112H164M32 156H164" stroke="#8b5cf6" stroke-opacity=".45" class="dash"/><g filter="url(#g)"><circle cx="32" cy="68" r="12" fill="#3b82f6"/><circle cx="98" cy="68" r="12" fill="#8b5cf6"/><circle cx="164" cy="68" r="12" fill="#ff3cac"/><circle cx="32" cy="112" r="12" fill="#22d3ee"/><circle cx="98" cy="112" r="12" fill="#a855f7"/><circle cx="164" cy="112" r="12" fill="#f59e0b"/><circle cx="32" cy="156" r="12" fill="#22c55e"/><circle cx="98" cy="156" r="12" fill="#8b5cf6"/><circle cx="164" cy="156" r="12" fill="#00e5ff"/></g><rect x="20" y="190" width="156" height="13" rx="6" fill="#201637"/><rect x="20" y="190" width="120" height="13" rx="6" fill="url(#violet)"/></g><g transform="translate(28 288)"><rect width="118" height="29" rx="14" fill="#1d1536" stroke="#8b5cf6"/><text x="59" y="20" text-anchor="middle" class="label" fill="#c4b5fd">OPEN SOURCE</text></g></g>

  <g transform="translate(28 1234)"><rect width="664" height="350" rx="24" class="card"/><rect width="8" height="350" rx="4" fill="url(#orange)"/><text x="28" y="38" class="label" fill="#fde68a">04 · E-COMMERCE / DEPLOYED</text><text x="28" y="84" class="title">Café Salas</text><text x="28" y="114" class="tag">Una tienda costarricense lista para vender.</text><text x="28" y="153" class="micro">CATALOG · CART · CHECKOUT · INVOICES</text><text x="28" y="177" class="micro">LARAVEL · PHP · NEON POSTGRES</text><g transform="translate(422 46)" class="float"><rect width="196" height="222" rx="20" fill="#171007" stroke="#6a4818"/><path d="M18 56H178L164 87H32Z" fill="url(#orange)"/><path d="M31 56V87M63 56V87M95 56V87M127 56V87M159 56V87" stroke="#fff3c4" stroke-opacity=".55"/><rect x="32" y="87" width="132" height="100" fill="#241a0d" stroke="#7c5a23"/><rect x="48" y="105" width="50" height="65" rx="7" fill="#3b2912"/><path d="M59 146C59 128 88 128 88 146" fill="none" stroke="#facc15" stroke-width="5"/><rect x="112" y="105" width="38" height="26" rx="6" fill="#5b3212"/><rect x="112" y="140" width="38" height="30" rx="6" fill="#3c2e18"/><circle cx="158" cy="30" r="15" fill="#f97316" filter="url(#g)" class="pulse"/><text x="158" y="35" text-anchor="middle" class="label" fill="white">₡</text></g><g transform="translate(28 288)"><rect width="76" height="29" rx="14" fill="#2d2108" stroke="#f59e0b"/><text x="38" y="20" text-anchor="middle" class="label" fill="#fde68a">LIVE</text><rect x="88" width="112" height="29" rx="14" fill="#27170b" stroke="#f97316"/><text x="144" y="20" text-anchor="middle" class="label" fill="#fdba74">COMMERCE</text></g></g>
  <text x="360" y="1627" text-anchor="middle" class="micro">REAL PROJECTS · PURPOSEFUL SYSTEMS</text>
