<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="databaseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673AB7; stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlowIcon">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#neonGlowIcon)">
    <rect x="25" y="20" width="50" height="60" rx="10" fill="url(#databaseGradient)" opacity="0.9"/>
    <rect x="35" y="30" width="30" height="10" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="35" y="45" width="30" height="10" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="35" y="60" width="30" height="10" rx="3" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="65" cy="35" rx="7" ry="5" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="65" cy="50" rx="7" ry="5" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="65" cy="65" rx="7" ry="5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
