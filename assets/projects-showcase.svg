<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Product showcase de Franklin Castillo</title>
  <desc id="desc">Cuatro tarjetas visuales para note, AURA, CloudScraperLLM y Café Salas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040713"/><stop offset=".5" stop-color="#0b1024"/><stop offset="1" stop-color="#16091e"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".32" stop-color="#3b82f6"/><stop offset=".58" stop-color="#8b5cf6"/><stop offset=".8" stop-color="#ff3cac"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3cac"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#facc15"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Cascadia Code,monospace}.card{fill:#080d1b;stroke:#283958;stroke-width:2}.title{font:800 31px Inter,Segoe UI,Arial,sans-serif;fill:#f3f8ff}.tagline{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#9db0c7}.micro{font:12px Consolas,Cascadia Code,monospace;fill:#8598b1;letter-spacing:.8px}.label{font:800 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.4px}.glow1{animation:g1 12s ease-in-out infinite}.glow2{animation:g2 12s ease-in-out infinite}.glow3{animation:g3 12s ease-in-out infinite}.glow4{animation:g4 12s ease-in-out infinite}.float{animation:float 12s ease-in-out infinite}.dash{stroke-dasharray:5 9;animation:dash 12s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes g1{0%,22%{stroke:#ff3cac}30%,100%{stroke:#283958}}@keyframes g2{0%,24%,48%,100%{stroke:#283958}28%,46%{stroke:#00e5ff}}@keyframes g3{0%,49%,73%,100%{stroke:#283958}52%,71%{stroke:#8b5cf6}}@keyframes g4{0%,74%,100%{stroke:#283958}77%,97%{stroke:#f59e0b}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes dash{to{stroke-dashoffset:-84}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="1398" height="898" rx="30" fill="url(#bg)" stroke="#293a60" stroke-width="2"/><rect x="1" y="1" width="1398" height="898" rx="30" fill="url(#grid)"/>
  <text x="50" y="55" class="ui" font-size="22" font-weight="800" fill="#eff8ff" letter-spacing="2">SELECTED PRODUCTS // 01—04</text><text x="1350" y="55" text-anchor="end" class="micro">PROBLEM → SYSTEM → VALUE</text><path d="M50 76H1350" stroke="url(#spectrum)" stroke-width="3" class="dash"/>

  <g transform="translate(45 105)" filter="url(#shadow)">
    <rect width="640" height="340" rx="24" class="card glow1"/>
    <rect width="8" height="340" rx="4" fill="url(#pink)"/><text x="30" y="39" class="label" fill="#f9a8d4">01 · FLAGSHIP / OWN BUSINESS</text><text x="30" y="86" class="title">note.</text><text x="30" y="116" class="tagline">Perfumería curada para descubrir mejor.</text>
    <text x="30" y="157" class="micro">SEARCH · FILTERS · OLFACTORY PROFILES</text><text x="30" y="181" class="micro">COMPARE · FAVORITES · WHATSAPP</text>
    <g transform="translate(30 222)"><rect width="94" height="28" rx="14" fill="#291126" stroke="#ff3cac"/><text x="47" y="19" text-anchor="middle" class="label" fill="#f9a8d4">PRIVATE</text><rect x="105" width="126" height="28" rx="14" fill="#15112c" stroke="#8b5cf6"/><text x="168" y="19" text-anchor="middle" class="label" fill="#c4b5fd">IN BUILD</text></g>
    <g transform="translate(376 43)" class="float">
      <rect width="224" height="250" rx="22" fill="#120b1c" stroke="#5a244f"/><rect x="17" y="18" width="190" height="25" rx="12" fill="#261124"/><circle cx="31" cy="30" r="5" fill="#ff3cac"/><path d="M43 30H116" stroke="#ba789f" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(72 65)"><rect x="30" width="80" height="25" rx="7" fill="#2b1730" stroke="#f472b6"/><rect x="18" y="23" width="104" height="112" rx="25" fill="url(#pink)" opacity=".82"/><path d="M40 60H100M40 78H87" stroke="#ffe7f5" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="108" cy="120" r="8" fill="#facc15" filter="url(#glow)" class="pulse"/></g>
      <rect x="18" y="217" width="50" height="18" rx="9" fill="#35172f"/><rect x="75" y="217" width="57" height="18" rx="9" fill="#201747"/><rect x="139" y="217" width="67" height="18" rx="9" fill="#3b1b17"/>
    </g>
    <text x="30" y="310" class="micro" fill="#f472b6">NEXT.JS 16 · REACT 19 · TYPESCRIPT · SUPABASE</text>
  </g>

  <g transform="translate(715 105)" filter="url(#shadow)">
    <rect width="640" height="340" rx="24" class="card glow2"/>
    <rect width="8" height="340" rx="4" fill="url(#cyan)"/><text x="30" y="39" class="label" fill="#67e8f9">02 · EDTECH / DEPLOYED</text><text x="30" y="86" class="title">AURA</text><text x="30" y="116" class="tagline">Recursos y aulas, visibles y organizados.</text>
    <text x="30" y="157" class="micro">AVAILABILITY · ASSIGNMENTS · ROLES</text><text x="30" y="181" class="micro">CALENDAR · REPORTS · AUDIT</text>
    <g transform="translate(30 222)"><rect width="78" height="28" rx="14" fill="#08222a" stroke="#00e5ff"/><text x="39" y="19" text-anchor="middle" class="label" fill="#67e8f9">LIVE</text><rect x="89" width="122" height="28" rx="14" fill="#101b39" stroke="#3b82f6"/><text x="150" y="19" text-anchor="middle" class="label" fill="#93c5fd">FULL-STACK</text></g>
    <g transform="translate(363 46)" class="float">
      <rect width="240" height="242" rx="20" fill="#07151e" stroke="#18546a"/><rect width="240" height="44" rx="20" fill="#0b2633"/><rect y="24" width="240" height="20" fill="#0b2633"/><circle cx="20" cy="21" r="5" fill="#22d3ee"/><path d="M34 21H106" stroke="#3d7184" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(17 64)"><text y="10" class="label" fill="#67e8f9">OCTOBER / ROOMS</text><g fill="#102b39" stroke="#23647b"><rect y="27" width="34" height="30" rx="5"/><rect x="42" y="27" width="34" height="30" rx="5" fill="#0e7490"/><rect x="84" y="27" width="34" height="30" rx="5"/><rect x="126" y="27" width="34" height="30" rx="5" fill="#2563eb"/><rect x="168" y="27" width="34" height="30" rx="5"/><rect y="65" width="34" height="30" rx="5"/><rect x="42" y="65" width="34" height="30" rx="5"/><rect x="84" y="65" width="34" height="30" rx="5" fill="#0891b2"/><rect x="126" y="65" width="34" height="30" rx="5"/><rect x="168" y="65" width="34" height="30" rx="5" fill="#1d4ed8"/></g><rect y="116" width="202" height="42" rx="10" fill="#0e2430"/><circle cx="18" cy="137" r="7" fill="#22c55e" class="pulse"/><path d="M34 132H118M34 144H86" stroke="#6b94a2" stroke-width="4" stroke-linecap="round"/></g>
    </g>
    <text x="30" y="310" class="micro" fill="#22d3ee">REACT 19 · EXPRESS 5 · SUPABASE</text>
  </g>

  <g transform="translate(45 475)" filter="url(#shadow)">
    <rect width="640" height="340" rx="24" class="card glow3"/>
    <rect width="8" height="340" rx="4" fill="url(#violet)"/><text x="30" y="39" class="label" fill="#c4b5fd">03 · AI PIPELINE / AUTOMATION</text><text x="30" y="86" class="title">CloudScraperLLM</text><text x="30" y="116" class="tagline">De productos dispersos a inteligencia útil.</text>
    <text x="30" y="157" class="micro">EXTRACT · STORE · SCHEDULE · SUMMARIZE</text><text x="30" y="181" class="micro">SCRAPING + AZURE OPENAI</text>
    <g transform="translate(30 222)"><rect width="116" height="28" rx="14" fill="#1d1536" stroke="#8b5cf6"/><text x="58" y="19" text-anchor="middle" class="label" fill="#c4b5fd">OPEN SOURCE</text></g>
    <g transform="translate(358 48)" class="float">
      <rect width="246" height="236" rx="20" fill="#100c20" stroke="#49327a"/><text x="20" y="29" class="micro">PIPELINE // RUNNING</text>
      <path d="M42 72H200M42 118H200M42 164H200" stroke="#8b5cf6" stroke-opacity=".34" stroke-width="2" class="dash"/>
      <g filter="url(#glow)"><circle cx="42" cy="72" r="14" fill="#3b82f6"/><circle cx="121" cy="72" r="14" fill="#8b5cf6"/><circle cx="200" cy="72" r="14" fill="#ff3cac"/><circle cx="42" cy="118" r="14" fill="#22d3ee"/><circle cx="121" cy="118" r="14" fill="#a855f7"/><circle cx="200" cy="118" r="14" fill="#f59e0b"/><circle cx="42" cy="164" r="14" fill="#22c55e"/><circle cx="121" cy="164" r="14" fill="#8b5cf6"/><circle cx="200" cy="164" r="14" fill="#00e5ff"/></g>
      <rect x="20" y="198" width="206" height="20" rx="10" fill="#1a1430"/><rect x="20" y="198" width="164" height="20" rx="10" fill="url(#violet)"><animate attributeName="width" values="36;164;36" dur="12s" repeatCount="indefinite"/></rect>
    </g>
    <text x="30" y="310" class="micro" fill="#a78bfa">PYTHON · FLASK · AZURE OPENAI · APSCHEDULER</text>
  </g>

  <g transform="translate(715 475)" filter="url(#shadow)">
    <rect width="640" height="340" rx="24" class="card glow4"/>
    <rect width="8" height="340" rx="4" fill="url(#orange)"/><text x="30" y="39" class="label" fill="#fde68a">04 · E-COMMERCE / DEPLOYED</text><text x="30" y="86" class="title">Café Salas</text><text x="30" y="116" class="tagline">Una tienda costarricense lista para vender.</text>
    <text x="30" y="157" class="micro">CATALOG · CART · CHECKOUT · INVOICES</text><text x="30" y="181" class="micro">AUTH · ADMIN · SERVERLESS</text>
    <g transform="translate(30 222)"><rect width="78" height="28" rx="14" fill="#2d2108" stroke="#f59e0b"/><text x="39" y="19" text-anchor="middle" class="label" fill="#fde68a">LIVE</text><rect x="89" width="112" height="28" rx="14" fill="#27170b" stroke="#f97316"/><text x="145" y="19" text-anchor="middle" class="label" fill="#fdba74">COMMERCE</text></g>
    <g transform="translate(364 45)" class="float">
      <rect width="238" height="244" rx="20" fill="#171007" stroke="#6a4818"/><path d="M20 58H218L201 93H37Z" fill="url(#orange)"/><path d="M33 58V93M70 58V93M107 58V93M144 58V93M181 58V93" stroke="#fff3c4" stroke-opacity=".55"/>
      <rect x="38" y="93" width="162" height="112" rx="4" fill="#241a0d" stroke="#7c5a23"/><rect x="54" y="112" width="58" height="74" rx="8" fill="#3b2912"/><path d="M67 160C67 137 99 137 99 160" fill="none" stroke="#facc15" stroke-width="5"/><rect x="127" y="112" width="57" height="32" rx="7" fill="#5b3212"/><rect x="127" y="153" width="57" height="33" rx="7" fill="#3c2e18"/><circle cx="197" cy="34" r="16" fill="#f97316" filter="url(#glow)" class="pulse"/><text x="197" y="39" text-anchor="middle" class="label" fill="white">₡</text>
      <rect x="38" y="216" width="162" height="12" rx="6" fill="#3a2a14"/><rect x="38" y="216" width="116" height="12" rx="6" fill="url(#orange)"/>
    </g>
    <text x="30" y="310" class="micro" fill="#fbbf24">LARAVEL 12 · PHP 8.2 · NEON POSTGRES</text>
  </g>
  <text x="700" y="865" text-anchor="middle" class="micro">REAL PROJECTS · PURPOSEFUL SYSTEMS · CONTINUOUS EVOLUTION</text>
</svg>
